PLG_SYSTEM_VMADMINCUSTOM="System - VM Admin Custom"
PLG_SYSTEM_VMADMINCUSTOM_DESC="Adds collapsible group management and UI tools for VirtueMart Custom Fields in the admin area."

; Toolbar buttons
PLG_SYSTEM_VMADMINCUSTOM_OPEN_ALL="Open all"
PLG_SYSTEM_VMADMINCUSTOM_CLOSE_ALL="Close all"

; Parameters
PLG_SYSTEM_VMADMINCUSTOM_FIELDSET_BASIC="General settings"

PLG_SYSTEM_VMADMINCUSTOM_OPEN_DEFAULT_LABEL="Open all groups by default"
PLG_SYSTEM_VMADMINCUSTOM_OPEN_DEFAULT_DESC="If enabled, all groups will be expanded by default."

PLG_SYSTEM_VMADMINCUSTOM_REMEMBER_STATE_LABEL="Remember open/close state (session)"
